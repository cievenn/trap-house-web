<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Générateur Vidéo HD - Logo 3D</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050A;
            touch-action: none;
        }
        
        #render-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Le canvas peut être calculé en 1080x1920 mais on l'affiche pour qu'il tienne sur l'écran */
            object-fit: contain; 
            display: block;
        }

        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            background: rgba(0,0,0,0.4); /* Assombrit un peu avant de lancer */
            transition: background 0.5s;
        }

        #start-btn {
            pointer-events: auto;
            padding: 18px 30px;
            font-size: 1.2rem;
            font-family: sans-serif;
            font-weight: bold;
            color: #05050A;
            background: #00F2FF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            max-width: 350px;
            text-align: center;
        }

        #start-btn:active, #start-btn:hover {
            transform: scale(0.95);
            background: #4DFFFF;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.8);
        }

        #status-display {
            font-size: 4rem;
            font-family: sans-serif;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .rec-dot {
            width: 30px;
            height: 30px;
            background-color: #ff0055;
            border-radius: 50%;
            margin-bottom: 20px;
            animation: blink 1s infinite;
            box-shadow: 0 0 20px #ff0055;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="render-canvas"></canvas>

    <div id="ui-layer">
        <button id="start-btn">🎥 Générer & Télécharger (Vidéo HD 1080x1920)</button>
        <div id="status-display">
            <div class="rec-dot"></div>
            <span id="countdown">15</span>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════════════
        //  SHADERS DU BACKGROUND
        // ═══════════════════════════════════════════════════════════════════════════════
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision highp float;
            uniform vec2 uResolution;
            uniform float uTime;
            uniform float uScroll;
            varying vec2 vUv;

            float hash(vec2 p) {
                vec3 p3  = fract(vec3(p.xyx) * 0.1031);
                p3 += dot(p3, p3.yzx + 33.33);
                return fract((p3.x + p3.y) * p3.z);
            }
            float noise(vec2 x) {
                vec2 i = floor(x); vec2 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                float a = hash(i + vec2(0.0, 0.0)); float b = hash(i + vec2(1.0, 0.0));
                float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0));
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }
            float fbm(vec2 p) {
                float v = 0.0; float a = 0.5; vec2 shift = vec2(100.0);
                mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.5));
                for (int i = 0; i < 5; ++i) {
                    v += a * noise(p); p = rot * p * 2.0 + shift; a *= 0.5;
                }
                return v;
            }

            vec3 getSceneColor(float t) {
                vec2 uv = vUv - 0.5;
                if (uResolution.x > uResolution.y) {
                    uv.x *= uResolution.x / uResolution.y;
                } else {
                    uv.y *= uResolution.y / uResolution.x;
                }
                uv += 0.5;

                float scrollFx = uScroll * 0.3;
                vec2 movement = vec2(t * 0.03, t * -0.08 + scrollFx);
                vec2 p = uv * 2.2 + movement;

                vec2 q = vec2(0.0);
                q.x = fbm(p + vec2(0.0, t * 0.03));
                q.y = fbm(p + vec2(1.0, t * 0.03));
                vec2 r = vec2(0.0);
                r.x = fbm(p + 0.4 * q + vec2(1.7, 9.2) + t * 0.02);
                r.y = fbm(p + 0.4 * q + vec2(8.3, 2.8) + t * 0.02);
                float f = fbm(p + r * 0.6);

                vec2 ep = uv * 3.5 + vec2(t * 0.08, t * -0.15 + scrollFx * 0.8);
                float eNoise = fbm(ep + r * 1.0 - t * 0.3);

                vec3 darkBlue  = vec3(0.01, 0.015, 0.04);
                vec3 midBlue   = vec3(0.04, 0.08, 0.18);
                vec3 lightBlue = vec3(0.1, 0.2, 0.4);

                vec3 color = mix(darkBlue, midBlue, smoothstep(0.1, 0.7, f));
                color = mix(color, lightBlue, smoothstep(0.4, 1.0, f) * smoothstep(0.2, 0.8, r.x));
                color *= (f * 1.5 + 0.1);

                float ridge = abs(eNoise - 0.5);
                float electricity = 0.0025 / (ridge + 0.003);

                float mask = smoothstep(0.45, 0.85, f);
                float flash = pow(sin(t * 3.0 + f * 10.0) * 0.5 + 0.5, 4.0);
                electricity *= mask * flash;

                vec3 elecColor = vec3(0.4, 0.8, 1.0);
                color += elecColor * electricity * 1.8;

                vec2 screenCenter = vUv - 0.5;
                if (uResolution.x > uResolution.y) {
                    screenCenter.x *= uResolution.x / uResolution.y;
                } else {
                    screenCenter.y *= uResolution.y / uResolution.x;
                }
                float vignette = 1.0 - dot(screenCenter, screenCenter) * 1.5;
                color *= clamp(vignette, 0.0, 1.0);

                return color;
            }

            void main() {
                float duration = 15.0;
                float t1 = mod(uTime, duration);
                float t2 = t1 - duration;
                float blendDuration = 15.0;
                float blendStart = duration - blendDuration;

                vec3 finalColor;
                if (t1 < blendStart) {
                    finalColor = getSceneColor(t1);
                } else {
                    float alpha = (t1 - blendStart) / blendDuration;
                    alpha = smoothstep(0.0, 1.0, alpha);
                    finalColor = mix(getSceneColor(t1), getSceneColor(t2), alpha);
                }
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // ═══════════════════════════════════════════════════════════════════════════════
        //  MOTEUR DE RENDU 
        // ═══════════════════════════════════════════════════════════════════════════════
        const canvas = document.getElementById('render-canvas');
        const renderer = new THREE.WebGLRenderer({ 
            canvas, 
            powerPreference: "high-performance",
            antialias: false 
        });
        
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.autoClear = false;

        const bgScene = new THREE.Scene();
        const bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const bgMaterial = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2() },
                uScroll: { value: 0 }
            },
            depthWrite: false,
            depthTest: false
        });
        const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
        bgScene.add(bgMesh);

        const logoScene = new THREE.Scene();
        const logoCamera = new THREE.PerspectiveCamera(45, 1080 / 1920, 0.1, 100);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        logoScene.environment = pmremGenerator.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

        const logoGroup = new THREE.Group();
        logoScene.add(logoGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.05 * Math.PI);
        logoScene.add(ambientLight);

        const spotLightTop = new THREE.SpotLight(0xD0E0FF, 100 * Math.PI);
        spotLightTop.position.set(0, 10, 8);
        spotLightTop.angle = 0.4;
        spotLightTop.penumbra = 0.8;
        spotLightTop.castShadow = true;
        spotLightTop.shadow.bias = -0.0001;
        logoScene.add(spotLightTop);

        const spotLightBack = new THREE.SpotLight(0x00F2FF, 15 * Math.PI);
        spotLightBack.position.set(0, 2, -10);
        spotLightBack.angle = 0.6;
        spotLightBack.penumbra = 1.0;
        logoScene.add(spotLightBack);

        const orbitLights = [
            { light: new THREE.PointLight(0x00F2FF, 0, 20), baseIntensity: 40 * Math.PI, radius: 8, speedObj: 3, yOffset: 2, phase: 0 },
            { light: new THREE.PointLight(0x4DFFFF, 0, 20), baseIntensity: 30 * Math.PI, radius: 6, speedObj: -2, yOffset: -1, phase: Math.PI },
            { light: new THREE.PointLight(0x0088FF, 0, 20), baseIntensity: 20 * Math.PI, radius: 5, speedObj: 4, yOffset: -3, phase: Math.PI * 0.5 }
        ];
        
        orbitLights.forEach(ol => {
            ol.light.decay = 2;
            logoScene.add(ol.light);
        });

        const loader = new THREE.GLTFLoader();
        loader.load('logo1_draco.glb', (gltf) => {
            const model = gltf.scene;
            
            const premiumMaterial = new THREE.MeshPhysicalMaterial({
                color: new THREE.Color("#050A15"),
                emissive: new THREE.Color("#00F2FF"),
                emissiveIntensity: 0.02,
                metalness: 1.0,
                roughness: 0.15,
                envMapIntensity: 4.0,
                clearcoat: 1.0,
                clearcoatRoughness: 0.05,
            });

            model.traverse((child) => {
                if (child.isMesh) {
                    child.material = premiumMaterial;
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            model.scale.set(5, 5, 5);
            model.position.set(0, 2, 0); 
            logoGroup.add(model);
        });

        const renderTarget = new THREE.WebGLRenderTarget(1080, 1920, {
            minFilter: THREE.LinearFilter,
            magFilter: THREE.LinearFilter,
            format: THREE.RGBAFormat,
            encoding: THREE.sRGBEncoding,
            samples: 4
        });
        
        const composer = new THREE.EffectComposer(renderer, renderTarget);
        
        const renderBg = new THREE.RenderPass(bgScene, bgCamera);
        renderBg.clear = true; 
        composer.addPass(renderBg);
        
        const renderLogo = new THREE.RenderPass(logoScene, logoCamera);
        renderLogo.clear = false; 
        composer.addPass(renderLogo);
        
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(1080, 1920), 0.8, 0.6, 0.6);
        composer.addPass(bloomPass);


        // ═══════════════════════════════════════════════════════════════════════════════
        //  MÉCANIQUE D'EXPORT VIDÉO (MEDIA RECORDER)
        // ═══════════════════════════════════════════════════════════════════════════════
        const btnStart = document.getElementById('start-btn');
        const statusDisplay = document.getElementById('status-display');
        const countdownEl = document.getElementById('countdown');
        const uiLayer = document.getElementById('ui-layer');
        
        let isRecording = false;
        let animationStartTime = 0;
        const ANIMATION_DURATION = 15.0;

        // On fait un rendu initial basse résolution pour la preview
        onWindowResizePreview();

        function onWindowResizePreview() {
            if (isRecording) return; // On bloque le resize pendant l'enregistrement pour ne pas casser la vidéo
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            bgMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            logoCamera.aspect = window.innerWidth / window.innerHeight;
            logoCamera.position.z = logoCamera.aspect < 1.0 ? 30.0 : 16.0; 
            logoCamera.updateProjectionMatrix();
            composer.render();
        }
        window.addEventListener('resize', onWindowResizePreview);

        btnStart.addEventListener('click', () => {
            btnStart.style.display = 'none';
            uiLayer.style.background = 'transparent';
            statusDisplay.style.display = 'flex';
            startRecordingAndAnimation();
        });

        function startRecordingAndAnimation() {
            isRecording = true;

            // 1. FORCER LA RÉSOLUTION HD VERTICALE POUR L'EXPORT
            const exportWidth = 1080;
            const exportHeight = 1920;
            
            renderer.setSize(exportWidth, exportHeight);
            composer.setSize(exportWidth, exportHeight);
            bgMaterial.uniforms.uResolution.value.set(exportWidth, exportHeight);
            logoCamera.aspect = exportWidth / exportHeight;
            logoCamera.position.z = 30.0; // Recule la caméra pour le format portrait
            logoCamera.updateProjectionMatrix();

            // 2. CONFIGURER LE MEDIA RECORDER
            const stream = canvas.captureStream(60); // Force 15 FPS
            let options = { mimeType: 'video/webm; codecs=vp9', videoBitsPerSecond: 15000000 }; // 15 Mbps (Très haute qualité)
            
            // Fallback si VP9 n'est pas supporté (ex: certains vieux Safari)
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm', videoBitsPerSecond: 15000000 };
            }

            const mediaRecorder = new MediaRecorder(stream, options);
            const recordedChunks = [];

            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = function() {
                // Création et téléchargement automatique du fichier
                const blob = new Blob(recordedChunks, { type: options.mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'Logo_Animation_HD_15s.webm';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);

                // Fin de l'enregistrement
                statusDisplay.style.display = 'none';
                btnStart.style.display = 'block';
                btnStart.innerText = "Téléchargement Terminé ! (Rafraîchir)";
                btnStart.onclick = () => window.location.reload();
                uiLayer.style.background = 'rgba(0,0,0,0.8)';
            };

            // 3. LANCER L'ENREGISTREMENT ET L'ANIMATION
            mediaRecorder.start();
            animationStartTime = performance.now();
            
            function recordAnimate() {
                if (!isRecording) return;
                requestAnimationFrame(recordAnimate);
                
                let elapsed = (performance.now() - animationStartTime) / 1000;
                
                // Si on a atteint 15 secondes, on coupe la vidéo
                if (elapsed >= ANIMATION_DURATION) {
                    isRecording = false;
                    mediaRecorder.stop();
                    return;
                }
                
                // Mise à jour de l'UI (Chronomètre inversé)
                countdownEl.innerText = Math.ceil(ANIMATION_DURATION - elapsed) + "s";

                // Mise à jour du Shader de fond
                bgMaterial.uniforms.uTime.value = elapsed;

                // Maths de la boucle
                const loopProgress = elapsed / ANIMATION_DURATION;
                const loopAngle = loopProgress * Math.PI * 2;

                orbitLights.forEach(ol => {
                    const tOrbit = loopAngle * ol.speedObj + ol.phase;
                    ol.light.position.set(
                        Math.cos(tOrbit) * ol.radius,
                        ol.yOffset + Math.sin(tOrbit * 2.0) * 2.0, 
                        Math.sin(tOrbit) * ol.radius
                    );
                    const pulse = Math.pow(Math.sin(loopAngle * 10), 2.0);
                    ol.light.intensity = ol.baseIntensity * (1.0 + pulse * 0.8);
                });

                // Animation Logo
                logoGroup.rotation.y = Math.sin(loopAngle * 2) * 0.15; 
                logoGroup.rotation.x = Math.sin(loopAngle * 3) * 0.08;
                logoGroup.rotation.z = Math.cos(loopAngle * 2) * 0.05;
                logoGroup.position.y = Math.sin(loopAngle * 4) * 0.4; 

                // Rendu
                renderer.clearDepth(); 
                composer.render();
            }

            recordAnimate();
        }
    </script>
</body>
</html>
